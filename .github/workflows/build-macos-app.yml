name: Build macOS App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: apple-silicon
          - runner: macos-15-intel
            architecture: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install --requirement requirements-build.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests_py -v
      - name: Build macOS application
        run: python -m PyInstaller --clean --noconfirm YuLawWorkbench.spec
      - name: Verify, sign and package application
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          test -d dist/YuLawWorkbench.app
          dist/YuLawWorkbench.app/Contents/MacOS/YuLawWorkbench --self-test
          codesign --force --deep --sign - dist/YuLawWorkbench.app
          codesign --verify --deep --strict --verbose=2 dist/YuLawWorkbench.app
          dist/YuLawWorkbench.app/Contents/MacOS/YuLawWorkbench &
          APP_PID=$!
          sleep 10
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            wait "$APP_PID"
            echo "Packaged GUI exited during the 10-second stability check" >&2
            exit 1
          fi
          kill "$APP_PID"
          wait "$APP_PID" || true
          file dist/YuLawWorkbench.app/Contents/MacOS/YuLawWorkbench
          mkdir dmg-root
          cp -R dist/YuLawWorkbench.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Yu Law Workbench" -srcfolder dmg-root -ov -format UDZO "dist/YuLawWorkbench-macOS-${ARCHITECTURE}.dmg"
          shasum -a 256 "dist/YuLawWorkbench-macOS-${ARCHITECTURE}.dmg" > "dist/SHA256SUMS-${ARCHITECTURE}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: YuLawWorkbench-macOS-${{ matrix.architecture }}
          path: |
            dist/YuLawWorkbench-macOS-${{ matrix.architecture }}.dmg
            dist/SHA256SUMS-${{ matrix.architecture }}.txt
          if-no-files-found: error
          retention-days: 30
