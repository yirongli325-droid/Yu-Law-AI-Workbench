name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --requirement requirements-build.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests_py -v
      - name: Build single-file executable
        shell: pwsh
        run: ./desktop/build-windows.ps1
      - name: Record SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/YuLawWorkbench.exe).Hash.ToLowerInvariant()
          "$hash  YuLawWorkbench.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Item dist/YuLawWorkbench.exe | Format-List Name,Length
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YuLawWorkbench-windows-x64
          path: |
            dist/YuLawWorkbench.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
